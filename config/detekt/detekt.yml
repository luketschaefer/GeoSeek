# Overrides on top of detekt's default config (buildUponDefaultConfig = true).
# Keep this file small; every override needs a reason.

naming:
  FunctionNaming:
    # Composables are PascalCase by convention.
    ignoreAnnotated: ['Composable']
  MatchingDeclarationName:
    # Feature navigation files (`XxxNavigation.kt`) pair route classes with a graph builder
    # function by convention; naming the file after the route would hide that.
    active: false

complexity:
  LongParameterList:
    # Composables take many optional parameters (modifier, colors, callbacks) by design.
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Preview']

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Preview', 'Composable']
    excludes: ['**/test/**', '**/androidTest/**']
  UnusedPrivateFunction:
    # @Preview functions are only referenced by tooling.
    ignoreAnnotated: ['Preview']
  ReturnCount:
    # Early-return guard clauses are the preferred style for reducers and validators.
    excludeGuardClauses: true
