name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build, lint, detekt, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Only the default branch writes the cache; PRs read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # `build` runs assemble + check, and check includes Android Lint, unit tests,
      # spotlessCheck (ktlint) and detekt. Instrumented tests are compiled so they don't rot.
      - name: Build and check
        run: ./gradlew build :app:assembleDebugAndroidTest --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/
            app/build/reports/
            domain/build/reports/
          retention-days: 7
